[package]
name = "web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
shared = { workspace = true }
leptos = { version = "0.7.7", features = ["csr"] }
leptos_router = { version = "0.7.7" }
leptos_meta = { version = "0.7.7" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Storage", "MediaQueryList", "File", "FileList", "FormData", "Blob", "Navigator", "ShareData", "Clipboard", "KeyboardEvent", "NodeList", "CssStyleDeclaration", "VisibilityState", "History", "TouchEvent", "TouchList", "Touch"] }
serde = { workspace = true }
chrono = { workspace = true }
gloo-net = { version = "0.7.0", features = ["http"] }
rexie = "0.6.2"
serde-wasm-bindgen = "0.6.5"
serde_json.workspace = true
wasm-bindgen-futures = "0.4"
uuid = { workspace = true, features = ["serde", "v4"] }
js-sys = "0.3.106"

[dev-dependencies]
wasm-bindgen-test = "0.3"
