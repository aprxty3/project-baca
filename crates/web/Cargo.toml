[package]
name = "web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# Component story route (`/__gallery`) in a release build, for running the
# web suite against release optimisations; debug builds always have it.
gallery = []

[dependencies]
shared = { workspace = true }
leptos = { version = "0.7.7", features = ["csr"] }
leptos_router = { version = "0.7.7" }
leptos_meta = { version = "0.8.7" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Storage", "File", "FileList", "FormData", "Navigator", "ShareData", "Clipboard", "KeyboardEvent", "NodeList", "CssStyleDeclaration", "VisibilityState", "History", "Location", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "DomRect", "Node", "DomTokenList", "PointerEvent", "Selection", "DomRectList", "MediaQueryList", "Headers", "RequestInit", "ResizeObserver"] }
serde = { workspace = true }
chrono = { workspace = true }
gloo-net = { version = "0.7.0", features = ["http"] }
rexie = "0.6.2"
serde-wasm-bindgen = "0.6.5"
serde_json.workspace = true
wasm-bindgen-futures = "0.4"
uuid = { workspace = true, features = ["serde", "v4"] }
js-sys = "0.3.106"
send_wrapper = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"
