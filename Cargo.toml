[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/shared",
    "crates/infra",
    "crates/server",
    "crates/web",
]
# Tauri shell, a workspace of its own (see apps/tauri/Cargo.toml).
exclude = ["apps/tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["Project Baca Contributors"]
license-file = "LICENSE"
publish = false
repository = "https://github.com/aprxty3/project-baca"

[workspace.dependencies]
domain = { path = "crates/domain" }
shared = { path = "crates/shared" }
infra = { path = "crates/infra" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "request-id"] }
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "postgres-vector"] }
redis = { version = "1.8", features = ["tokio-comp", "streams", "connection-manager"] }
dotenvy = "0.15"
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
validator = { version = "0.21", features = ["derive"] }
utoipa = { version = "6.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }
argon2 = "0.6"
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["http-1x", "default-https-client", "rt-tokio"] }
sha2 = "0.11"
hmac = "0.13"
# Error tracking: no default transport (it pulls native-tls); reqwest on rustls.
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tower-axum-matched-path", "tracing"] }
# HS256 only, on the aws-lc-rs backend rustls already links.
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Same TLS stack as reqwest (rustls + webpki roots + ring), no OpenSSL.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls-tls"] }
async-trait = "0.1"
mockall = "0.15"
pretty_assertions = "1.4"
claims = "0.8"
rstest = "0.28"

# WebAssembly bundle only (`make build-web`): size over speed, whole-program
# LTO, one codegen unit. The server keeps the default release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Full debuginfo across ~570 crates made each test binary ~390 MB and target/ reach 50+ GB.
# `trunk serve` (make dev frontend): opt-level 0 makes a 64 MB wasm that a
# service-worker-controlled page reads twice (preload plus init fetch), and
# Chromium never finishes the unread copy; opt-level 1 keeps it near release
# size while staying an incremental dev build. The server keeps `dev`.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

