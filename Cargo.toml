[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/shared",
    "crates/infra",
    "crates/server",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Project Baca Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aprxty3/project-baca"

[workspace.dependencies]
domain = { path = "crates/domain" }
shared = { path = "crates/shared" }
infra = { path = "crates/infra" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
redis = { version = "0.27", features = ["tokio-comp", "streams"] }
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.19", features = ["derive"] }
