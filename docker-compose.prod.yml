# ==============================================================================
# Project Baca — production compose: the whole stack on one host (ADR-46).
# Usage: cp .env.production.example .env.production
#        make prod-pull prod-migrate prod-up   (release images, ROTARIA_VERSION)
#        make prod-build prod-up               (images built from this checkout)
# On the host a deploy pins each release image by digest (ROTARIA_*_IMAGE in
# .env.deploy, scripts/deploy.sh).
# Dev stack stays in docker-compose.yml (host ports 5433/6380/9005/9006).
# Memory and CPU budget per service: ARCHITECTURE.md section 8.
# ==============================================================================

# The default json-file driver never rotates, so a small VPS disk fills up.
x-logging: &logging
  driver: local

# The tunnel network's fixed addresses. The edge trusts CF-Connecting-IP only
# from cloudflared's own address (Caddyfile.prod): not the subnet, whose
# gateway (.1) is the host itself, so a host process cannot name a client.
# No other service and no published port may join that network.
x-tunnel-subnet: &tunnel_subnet 10.203.53.0/29
x-cloudflared-ip: &cloudflared_ip 10.203.53.2

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    restart: always
    logging: *logging
    mem_limit: 2g
    cpus: 1.0
    networks: [store]
    environment:
      POSTGRES_USER: baca_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: project_baca_db
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      # Runs only on an empty volume; an existing one takes `make prod-db-role`.
      - ./scripts/postgres_app_role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baca_user -d project_baca_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off migration runner (make prod-migrate): the migrations and the
  # runner of the checked-out tag, mounted read-only. It connects as the
  # schema owner; server and worker connect as rotaria_app.
  migrate:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    profiles: ["ops"]
    logging: *logging
    mem_limit: 256m
    cpus: 0.5
    networks: [store]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /work
    entrypoint: ["bash", "scripts/migrate.sh"]
    command: ["up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://baca_user:${POSTGRES_PASSWORD}@postgres:5432/project_baca_db
    volumes:
      - ./migrations:/work/migrations:ro
      - ./scripts/migrate.sh:/work/scripts/migrate.sh:ro

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: always
    logging: *logging
    mem_limit: 256m
    cpus: 0.25
    networks: [store]
    # Refresh tokens and sessions live here; RDB alone loses the minutes
    # since the last snapshot on a restart. Redis rewrites its process title,
    # so the password does not show in `ps`.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata_prod:/data
    healthcheck:
      # redis-cli exits 0 on a NOAUTH reply too, so only PONG counts.
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bundled store for a host without R2 (`--profile minio`, with
  # S3_ENDPOINT=http://minio:9000).
  minio:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio:latest@sha256:aea6c163749e1caca37f907976dcf337177ddf5f558808f2aa591618fd3a6eef
    restart: always
    logging: *logging
    mem_limit: 512m
    cpus: 0.5
    networks: [store]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3 keys}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3 keys}
    volumes:
      - miniodata_prod:/data

  # Downloads the embedding model at its pinned revision into the volume
  # (scripts/fetch_embedding_model.sh) and exits; a rerun with the files in
  # place downloads nothing. The only embedding container with a route out.
  embedder-fetch:
    image: &embedder_image ${EMBEDDER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9@sha256:798cd7615e060a72ccbdf19aa0ada52289c6a0147490195bafaece6ce04d70f1}
    restart: "no"
    logging: *logging
    mem_limit: 128m
    cpus: 0.5
    networks: [default]
    entrypoint: ["/fetch.sh"]
    volumes:
      - embedder_models:/data
      - ./scripts/fetch_embedding_model.sh:/fetch.sh:ro

  # Self-hosted embeddings (ADR-49) for chunks (worker) and reader queries
  # (server): text-embeddings-inference serving EmbeddingGemma 300M (4-bit
  # ONNX), 768 dimensions, on CPU. Only on `store`: no route out, no
  # published port, so book text and queries never leave the host. Budget:
  # ARCHITECTURE.md section 8.
  embedder:
    image: *embedder_image
    restart: always
    logging: *logging
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    user: "65534:65534"
    networks: [store]
    depends_on:
      embedder-fetch:
        condition: service_completed_successfully
    command: ["--model-id", "/data/embeddinggemma-300m-q4", "--pooling", "mean", "--tokenization-workers", "1"]
    volumes:
      - embedder_models:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # The model's load budget (arm64 is unmeasured); the first passing
      # check ends it early. scripts/deploy.sh waits a little longer.
      start_period: 600s

  server:
    image: ${ROTARIA_SERVER_IMAGE:-ghcr.io/aprxty3/project-baca/server:${ROTARIA_VERSION:?set ROTARIA_VERSION}}
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: always
    # Compose sends SIGKILL after the grace period (10 s by default); Axum
    # drains in-flight requests, so a 50 MB admin upload gets 30 s.
    stop_grace_period: 30s
    logging: *logging
    # 100 parallel logins peaked at 189 MB (Dockerfile.server).
    mem_limit: 512m
    cpus: 1.0
    networks: [default, store]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      LOG_FORMAT: json
      RUST_LOG: info,tower_http=warn
      # Error tracking (Sentry, EU region); empty turns it off.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # The site, plus the Tauri app WebView (tauri:// on desktop, http://tauri.localhost on Android and Windows).
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN},tauri://localhost,http://tauri.localhost
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-x-forwarded-for}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-600}
      BOOK_SEARCH_RATE_LIMIT_PER_MINUTE: ${BOOK_SEARCH_RATE_LIMIT_PER_MINUTE:-30}
      OTP_HOURLY_BUDGET: ${OTP_HOURLY_BUDGET:-100}
      AI_DAILY_BUDGET: ${AI_DAILY_BUDGET:-5000}
      JWT_SECRET: ${JWT_SECRET:?set a 32+ char secret}
      JWT_ACCESS_EXPIRY_MINUTES: 60
      JWT_REFRESH_EXPIRY_DAYS: 14
      DATABASE_URL: postgres://rotaria_app:${POSTGRES_APP_PASSWORD}@postgres:5432/project_baca_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3 keys}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3 keys}
      S3_BUCKET_EPUBS: ${S3_BUCKET_EPUBS:-baca-epubs}
      S3_BUCKET_COVERS: ${S3_BUCKET_COVERS:-baca-covers}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SMTP_HOST: ${SMTP_HOST:?set SMTP}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?set SMTP}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Project Baca}
      # Not a start dependency: until the model is up, quote search answers 503 AI_UNAVAILABLE.
      EMBEDDING_PROVIDER: tei
      EMBEDDING_URL: http://embedder:80
      EMBEDDING_DIMENSION: 768

  worker:
    image: ${ROTARIA_WORKER_IMAGE:-ghcr.io/aprxty3/project-baca/worker:${ROTARIA_VERSION:?set ROTARIA_VERSION}}
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    stop_grace_period: 30s
    logging: *logging
    # tini as PID 1 forwards SIGTERM to the worker, which releases its job.
    init: true
    # A runaway parse is killed inside its own cgroup, never Postgres by the
    # host OOM killer; the largest real book peaks near 100 MB.
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    networks: [default, store]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Ingestion embeds every chunk; the server does not wait (quote search
      # answers 503 until the model is up), and deploy.sh starts both after it.
      embedder:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: postgres://rotaria_app:${POSTGRES_APP_PASSWORD}@postgres:5432/project_baca_db
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3 keys}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3 keys}
      S3_BUCKET_EPUBS: ${S3_BUCKET_EPUBS:-baca-epubs}
      S3_BUCKET_COVERS: ${S3_BUCKET_COVERS:-baca-covers}
      EMBEDDING_URL: http://embedder:80
      # Cards and recaps at ingestion; the server never calls Claude.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set the Anthropic API key}
      APP_ENV: production
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: worker@${ROTARIA_VERSION}

  edge:
    image: ${ROTARIA_EDGE_IMAGE:-ghcr.io/aprxty3/project-baca/edge:${ROTARIA_VERSION:?set ROTARIA_VERSION}}
    build:
      context: .
      dockerfile: Dockerfile.edge
      args:
        API_BASE_URL: ${API_BASE_URL:-/api/v1}
    restart: always
    logging: *logging
    mem_limit: 128m
    cpus: 0.5
    # Matches Caddy's grace_period, so in-flight requests finish on a stop.
    stop_grace_period: 30s
    networks:
      default:
      tunnel:
        # Pinned so it can never take cloudflared's address first.
        ipv4_address: 10.203.53.3
    depends_on:
      - server
    # No published port: every request arrives through cloudflared.
    environment:
      TRUSTED_PROXY: *cloudflared_ip
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy

  # Encrypted dump to the backup bucket at start and every 6 hours
  # (scripts/pg_backup.sh); the host has no cron or timer for it. Its R2 token
  # reaches only the backup bucket and is never given to server or worker.
  backup:
    image: ${ROTARIA_BACKUP_IMAGE:-ghcr.io/aprxty3/project-baca/backup:${ROTARIA_VERSION:?set ROTARIA_VERSION}}
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: always
    init: true
    logging: *logging
    mem_limit: 256m
    cpus: 0.5
    # store reaches Postgres; default reaches R2 and the heartbeat check.
    networks: [default, store]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pg_backup.sh", "--every", "21600"]
    environment:
      PGHOST: postgres
      PGUSER: baca_user
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: project_baca_db
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?set the backup bucket}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-rotaria-backups}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?set the backup bucket}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?set the backup bucket}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}

  # Outbound-only connector to Cloudflare. The Tunnel's public hostnames
  # (rotaria.site, www.rotaria.site) point at http://edge:80; on the tunnel
  # network it reaches nothing else.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: always
    logging: *logging
    mem_limit: 128m
    cpus: 0.25
    networks:
      tunnel:
        ipv4_address: *cloudflared_ip
    depends_on:
      - edge
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
      # Metrics and pprof stay inside the container.
      TUNNEL_METRICS: 127.0.0.1:20241

# Postgres, Redis, the embedder (and MinIO) have no route out and no published port;
# only the services that hold their credentials, and their embedder, join this network.
networks:
  store:
    internal: true
  # The edge's only way in from the Cloudflare Tunnel connector, which must not
  # reach the server past the edge's client-address rewrite.
  tunnel:
    ipam:
      config:
        - subnet: *tunnel_subnet

volumes:
  pgdata_prod:
  redisdata_prod:
  miniodata_prod:
  caddy_data:
  caddy_config:
  caddy_logs:
  embedder_models:
