# Development services. Every port binds to loopback: the credentials below
# are public defaults, so nothing here may be reachable from the LAN.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: project_baca_db
    restart: always
    environment:
      POSTGRES_USER: baca_user
      POSTGRES_PASSWORD: baca_password
      POSTGRES_DB: project_baca_db
    ports:
      - "127.0.0.1:5433:5432" # Host port 5433 avoids collisions with default Postgres
    volumes:
      - pgdata_baca:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baca_user -d project_baca_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: project_baca_redis
    restart: always
    ports:
      - "127.0.0.1:6380:6379" # Host port 6380 avoids collisions with default Redis
    volumes:
      - redisdata_baca:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: project_baca_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9005:9000" # S3 API endpoint
      - "127.0.0.1:9006:9001" # Web console
    volumes:
      - miniodata_baca:/data

  # The embedding model the server (queries) and worker (chunks) share,
  # started by `make embedder-up`; its first run downloads the model (about
  # 210 MB) into embedder_models. Behind a profile, so `make db-up` (and CI)
  # never pulls it.
  embedder-fetch:
    profiles: ["embedder"]
    image: &embedder_image ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: "no"
    entrypoint: ["/fetch.sh"]
    volumes:
      - embedder_models:/data
      - ./scripts/fetch_embedding_model.sh:/fetch.sh:ro

  embedder:
    profiles: ["embedder"]
    image: *embedder_image
    container_name: project_baca_embedder
    restart: always
    user: "65534:65534"
    depends_on:
      embedder-fetch:
        condition: service_completed_successfully
    command: ["--model-id", "/data/embeddinggemma-300m-q4", "--pooling", "mean", "--tokenization-workers", "1"]
    cpus: 1.0
    ports:
      - "127.0.0.1:8090:80" # EMBEDDING_URL
    volumes:
      - embedder_models:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  mailpit:
    image: axllent/mailpit:latest
    container_name: project_baca_mailpit
    restart: always
    ports:
      - "127.0.0.1:1025:1025" # SMTP port
      - "127.0.0.1:8025:8025" # Web UI for transactional emails

volumes:
  pgdata_baca:
  redisdata_baca:
  miniodata_baca:
  embedder_models:
