<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Rotaria watermill icon">
  <title>Rotaria — kincir air lumbung</title>
  <!-- atap: arsir searah lereng -->
  <g stroke="#2B2625" stroke-linecap="round">
    <path d="M45 130 L120 84 L195 130" fill="none" stroke-width="3.4"/>
    <path d="M70 130 L120 100 L170 130" fill="none" stroke-width="2.4"/>
    <g stroke-width="1.1">
      <path d="M62 124 L96 102 M76 128 L110 106 M90 130 L124 108 M104 130 L134 112"/>
      <path d="M178 124 L144 102 M164 128 L130 106 M150 130 L116 108 M136 130 L106 112"/>
    </g>
    <!-- tiang + serat kayu -->
    <path d="M60 130 V220 M180 130 V220" fill="none" stroke-width="3.2"/>
    <path d="M60 130 H180" fill="none" stroke-width="3"/>
    <g stroke-width="1">
      <path d="M64 140 V212 M56 150 V200 M184 140 V212 M176 150 V200"/>
    </g>
    <!-- dinding: anyaman + arsir silang -->
    <g stroke-width="1.1">
      <path d="M60 150 H180 M60 170 H180 M60 190 H180 M60 210 H180"/>
      <path d="M80 130 V220 M100 130 V220 M140 130 V220 M160 130 V220"/>
      <path d="M66 136 L94 164 M94 136 L66 164 M146 136 L174 164 M174 136 L146 164 M106 176 L134 204 M134 176 L106 204"/>
    </g>
    <!-- roda air -->
    <g fill="none">
      <circle cx="120" cy="176" r="44" stroke-width="3"/>
      <circle cx="120" cy="176" r="34" stroke-width="2"/>
      <path d="M120 132 V220 M76 176 H164 M89 145 L151 207 M151 145 L89 207" stroke-width="2.6"/>
      <g stroke-width="2.2">
        <path d="M112 136 H128 M74 168 V184 M74 168 H90 M156 168 H166 V184 M112 216 H128 M92 200 L82 210 M148 200 L158 210 M92 152 L82 142 M148 152 L158 142"/>
      </g>
      <!-- arsir lengkung jeruji -->
      <g stroke-width="0.9">
        <path d="M100 150 q20 10 40 0 M100 202 q20 -10 40 0 M94 176 h52"/>
      </g>
    </g>
    <!-- sungai: gelombang + riak -->
    <path d="M20 226 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke-width="2"/>
    <path d="M40 234 q20 -8 40 0 t40 0 t40 0 t40 0" fill="none" stroke-width="1.3"/>
    <g stroke-width="0.9">
      <path d="M60 230 h14 M110 230 h14 M160 230 h14 M85 238 h12 M135 238 h12"/>
    </g>
  </g>
  <!-- hub terracotta -->
  <circle cx="120" cy="176" r="9" fill="#9D5A3C" stroke="#2B2625" stroke-width="3"/>
  <circle cx="120" cy="176" r="2.6" fill="#F9F6F0" stroke="none"/>
</svg>
